services:
  db:
    image: postgres:16
    container_name: keitaro_wrapper_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - keitaro_wrapper_postgres_data:/var/lib/postgresql/data

volumes:
  keitaro_wrapper_postgres_data: